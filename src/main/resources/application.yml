spring:
  application:
    name: job-platform-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

ai:
  enabled: ${AI_ENABLED:true}
  base-url: ${AI_BASE_URL:http://localhost:8000}
  timeout: ${AI_TIMEOUT:120s}
  connect-timeout: ${AI_CONNECT_TIMEOUT:30s}
  read-timeout: ${AI_READ_TIMEOUT:120s}

providers:
  enabled:
    arbeitnow: ${ARBEITNOW_ENABLED:true}
    remoteok: ${REMOTEOK_ENABLED:true}

environment:
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata"